<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>remote control</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="auth-screen">
    <div class="auth-card">
      <div class="logo">
        <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
          <rect x="4" y="4" width="40" height="28" rx="2" stroke="#FBBF24" stroke-width="2"/>
          <path d="M12 36L20 32L28 32L36 36" stroke="#FBBF24" stroke-width="2" stroke-linecap="round"/>
          <circle cx="24" cy="16" r="3" fill="#FBBF24"/>
          <path d="M24 19L24 24" stroke="#FBBF24" stroke-width="2"/>
        </svg>
      </div>
      <h1>remote pc control</h1>
      <p class="subtitle">control your windows pc from anywhere</p>
      <input type="password" id="token-input" placeholder="auth token" autocomplete="off">
      <button id="connect-btn">connect</button>
      <div id="auth-error"></div>
    </div>
  </div>
  
  <div id="control-screen" style="display: none;">
    <div class="header">
      <div class="header-left">
        <span class="status-badge">
          <span class="status-dot"></span>
          <span id="status-text">connected</span>
        </span>
        <span id="latency" class="latency">~0ms</span>
      </div>
      <div class="header-right">
        <button class="icon-btn" id="settings-btn" title="settings">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
            <path d="M10 6a4 4 0 100 8 4 4 0 000-8zM8 10a2 2 0 114 0 2 2 0 01-4 0z"/>
            <path d="M10 2a1 1 0 011 1v1.17a6 6 0 012.83 1.17l.83-.83a1 1 0 011.41 1.41l-.83.83A6 6 0 0116.83 9H18a1 1 0 110 2h-1.17a6 6 0 01-1.17 2.83l.83.83a1 1 0 01-1.41 1.41l-.83-.83A6 6 0 0111 16.83V18a1 1 0 11-2 0v-1.17a6 6 0 01-2.83-1.17l-.83.83a1 1 0 01-1.41-1.41l.83-.83A6 6 0 013.17 11H2a1 1 0 110-2h1.17a6 6 0 011.17-2.83l-.83-.83a1 1 0 111.41-1.41l.83.83A6 6 0 019 3.17V2a1 1 0 011-1z"/>
          </svg>
        </button>
        <button class="icon-btn" id="keyboard-toggle" title="keyboard">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
            <path d="M4 5a2 2 0 00-2 2v6a2 2 0 002 2h12a2 2 0 002-2V7a2 2 0 00-2-2H4zm0 2h12v6H4V7z"/>
            <path d="M6 9h2v2H6V9zm3 0h2v2H9V9zm3 0h2v2h-2V9zm-6 3h8v1H6v-1z"/>
          </svg>
        </button>
        <button class="icon-btn" id="terminal-toggle" title="terminal">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
            <path d="M3 4a1 1 0 011-1h12a1 1 0 011 1v12a1 1 0 01-1 1H4a1 1 0 01-1-1V4zm2 1v10h10V5H5z"/>
            <path d="M6 7l3 2-3 2V7zm4 4h4v1h-4v-1z"/>
          </svg>
        </button>
        <button class="icon-btn danger" id="disconnect-btn" title="disconnect">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
            <path d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z"/>
          </svg>
        </button>
      </div>
    </div>
    
    <div class="main-content">
      <div class="screen-wrapper">
        <div class="screen-container">
          <canvas id="screen"></canvas>
          <div id="touch-indicator"></div>
        </div>
      </div>
      
      <div id="settings-panel" class="panel" style="display: none;">
        <h3>performance settings</h3>
        <div class="setting-group">
          <label>quality <span id="quality-val">60</span>%</label>
          <input type="range" id="quality-slider" min="30" max="90" value="60">
        </div>
        <div class="setting-group">
          <label>fps <span id="fps-val">15</span></label>
          <input type="range" id="fps-slider" min="5" max="30" value="15">
        </div>
        <div class="setting-group">
          <label>scale <span id="scale-val">70</span>%</label>
          <input type="range" id="scale-slider" min="40" max="100" value="70">
        </div>
        <button id="apply-settings">apply changes</button>
      </div>
      
      <div id="keyboard-panel" class="panel" style="display: none;">
        <div class="text-input-row">
          <input type="text" id="text-input" placeholder="type text here...">
          <button id="send-text">send</button>
        </div>
        <div class="keyboard-grid">
          <button data-key="escape">esc</button>
          <button data-key="f5">f5</button>
          <button data-key="tab">tab</button>
          <button data-key="backspace">⌫</button>
          
          <button data-key="control" class="modifier">ctrl</button>
          <button data-key="alt" class="modifier">alt</button>
          <button data-key="shift" class="modifier">shift</button>
          <button data-key="command" class="modifier">win</button>
          
          <button data-combo='{"key":"c","modifiers":["control"]}'>ctrl+c</button>
          <button data-combo='{"key":"v","modifiers":["control"]}'>ctrl+v</button>
          <button data-combo='{"key":"z","modifiers":["control"]}'>ctrl+z</button>
          <button data-combo='{"key":"f","modifiers":["control"]}'>ctrl+f</button>
          
          <button data-key="enter">enter</button>
          <button data-key="space">space</button>
          <button data-key="up">↑</button>
          <button data-key="down">↓</button>
          
          <button data-key="left">←</button>
          <button data-key="right">→</button>
          <button data-key="home">home</button>
          <button data-key="end">end</button>
        </div>
      </div>
      
      <div id="terminal-panel" class="panel" style="display: none;">
        <div id="terminal-output"></div>
        <div class="terminal-input-row">
          <span class="prompt">PS&gt;</span>
          <input type="text" id="cmd-input" placeholder="enter powershell command...">
          <button id="run-cmd">run</button>
        </div>
      </div>
    </div>
  </div>
  
  <script src="client.js"></script>
</body>
</html>
